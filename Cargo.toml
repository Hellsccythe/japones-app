[workspace]
resolver = "2"
members = ["crates/*", "cli", "app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
lindera = { version = "6.2", features = ["embed-ipadic"] }
wana_kana = "5"
sha1_smol = "1"
typst-as-lib = { version = "0.17", features = ["typst-kit-fonts"] }
typst-pdf = "0.15"
typst = "0.15"
typst-layout = "0.15"
# "bundled" avoids needing a system SQLite.
rusqlite = { version = "0.25", features = ["bundled"] }
bzip2 = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
llama-cpp-2 = "0.1.160"
voicevox_core = { git = "https://github.com/VOICEVOX/voicevox_core", tag = "0.17.1", features = ["load-onnxruntime"] }
# Same major as voicevox_core uses for AudioQuery fields.
typed_floats = "1"
flate2 = "1"
tar = "0.4"
# RAM total, to pick the local model (MIT).
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

jp-core = { path = "crates/jp-core" }
dict = { path = "crates/dict" }
sentences = { path = "crates/sentences" }
anki = { path = "crates/anki" }
pdf = { path = "crates/pdf" }
tts = { path = "crates/tts" }
engine = { path = "crates/engine" }
local-llm = { path = "crates/local-llm" }
assets = { path = "crates/assets" }
srs = { path = "crates/srs" }

[profile.release]
# Symbols would add ~25 MB to the Android library (JNI exports stay in .dynsym).
strip = "symbols"
