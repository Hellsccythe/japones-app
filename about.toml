# Third-party licenses page for the app (Configurações › Sobre). Only permissive
# licenses are accepted, so this fails if a GPL/AGPL dependency is added:
#   cargo about generate app/licenses.hbs -o app/ui/licenses.html
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
]
targets = ["x86_64-pc-windows-msvc", "aarch64-linux-android", "x86_64-linux-android"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The app's own crates aren't published and have no license field yet.
private = { ignore = true }
